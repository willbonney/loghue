<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Loghue</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>Loghue</h1>
  <p>Syntax highlighting for Jenkins logs in CloudBees CI.</p>
  <label class="toggle">
    <input id="enabled" type="checkbox">
    Highlight logs
  </label>
  <button id="options" type="button">Colors</button>
  <p id="status" role="status"></p>
  <script src="popup.js"></script>
</body>
</html>
